<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Glowing Accent Gradients -->
    <radialGradient id="cyanGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#06b6d4" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="purpleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="roseGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f43f5e" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradients -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="badgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="streamGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#818cf8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#34d399" stop-opacity="0.8" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" />
    </filter>

    <style>
      @keyframes pulseGlow {
        0%, 100% { opacity: 0.35; transform: scale(1); }
        50% { opacity: 0.65; transform: scale(1.08); }
      }
      @keyframes floatSlow {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
      }
      @keyframes floatReverse {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(8px); }
      }
      @keyframes dashFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes pulseDot {
        0%, 100% { r: 4px; opacity: 0.6; }
        50% { r: 6.5px; opacity: 1; }
      }
      .anim-glow-cyan {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: 250px 140px;
      }
      .anim-glow-purple {
        animation: pulseGlow 10s ease-in-out infinite 2s;
        transform-origin: 950px 220px;
      }
      .anim-float-1 {
        animation: floatSlow 6s ease-in-out infinite;
      }
      .anim-float-2 {
        animation: floatReverse 7s ease-in-out infinite 1s;
      }
      .flow-line {
        stroke-dasharray: 8 6;
        animation: dashFlow 25s linear infinite;
      }
      .dot-pulse {
        animation: pulseDot 3s ease-in-out infinite;
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 800;
        letter-spacing: -0.03em;
      }
      .sub-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        font-weight: 400;
      }
      .mono-text {
        font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      }
    </style>
  </defs>

  <!-- Card Frame -->
  <rect width="1200" height="380" rx="16" fill="url(#bgGrad)" />
  <rect width="1198" height="378" x="1" y="1" rx="15" fill="none" stroke="#334155" stroke-opacity="0.6" stroke-width="1.5" />

  <!-- Dynamic Ambient Glow Blobs in Background -->
  <g filter="url(#blurFilter)">
    <circle cx="240" cy="120" r="150" fill="url(#cyanGlow)" class="anim-glow-cyan" />
    <circle cx="960" cy="240" r="160" fill="url(#purpleGlow)" class="anim-glow-purple" />
    <circle cx="600" cy="300" r="130" fill="url(#roseGlow)" class="anim-glow-cyan" />
  </g>

  <!-- Flow Diagrams / Circuit Streams (Background dynamic aspect) -->
  <g opacity="0.35">
    <path d="M 120 70 L 400 70 L 460 110 L 800 110 L 880 70 L 1080 70" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" />
    <path d="M 100 310 L 320 310 L 380 270 L 760 270 L 820 310 L 1100 310" fill="none" stroke="#818cf8" stroke-width="1.5" class="flow-line" />
    
    <circle cx="460" cy="110" fill="#38bdf8" class="dot-pulse" />
    <circle cx="800" cy="110" fill="#818cf8" class="dot-pulse" style="animation-delay: 1s;" />
    <circle cx="380" cy="270" fill="#818cf8" class="dot-pulse" style="animation-delay: 1.5s;" />
    <circle cx="760" cy="270" fill="#34d399" class="dot-pulse" style="animation-delay: 2s;" />
  </g>

  <!-- Gentle Floating Background Feature Badges (Kept at low opacity and outside text bounds) -->
  <g class="anim-float-1" opacity="0.45">
    <rect x="80" y="125" width="130" height="30" rx="15" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="145" y="145" fill="#38bdf8" font-size="11" text-anchor="middle" class="mono-text" font-weight="600">⚡ ITIL 4 KEDB</text>
  </g>
  <g class="anim-float-2" opacity="0.45">
    <rect x="990" y="130" width="130" height="30" rx="15" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="1055" y="150" fill="#c084fc" font-size="11" text-anchor="middle" class="mono-text" font-weight="600">🔍 Root Cause</text>
  </g>
  <g class="anim-float-1" opacity="0.45">
    <rect x="1000" y="240" width="125" height="30" rx="15" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="1062" y="260" fill="#34d399" font-size="11" text-anchor="middle" class="mono-text" font-weight="600">🛡️ Zero Recurrence</text>
  </g>
  <g class="anim-float-2" opacity="0.45">
    <rect x="75" y="235" width="135" height="30" rx="15" fill="#1e293b" stroke="#f59e0b" stroke-width="1" />
    <text x="142" y="255" fill="#f59e0b" font-size="11" text-anchor="middle" class="mono-text" font-weight="600">📊 5-Whys &amp; RCA</text>
  </g>

  <!-- FOREGROUND CONTENT: High clarity, centered, guaranteed unobstructed -->
  <!-- Top Category Chip -->
  <g>
    <rect x="425" y="48" width="350" height="32" rx="16" fill="url(#badgeGrad)" stroke="#475569" stroke-width="1" />
    <circle cx="445" cy="64" r="5" fill="#10b981" />
    <text x="605" y="69" fill="#94a3b8" font-size="12" font-weight="600" text-anchor="middle" class="mono-text" letter-spacing="1.2">CURATED ITIL &amp; ITSM ECOSYSTEM</text>
  </g>

  <!-- Main Repository Title -->
  <text x="600" y="152" fill="url(#titleGrad)" font-size="44" text-anchor="middle" class="title-text">
    Awesome Problem Management
  </text>

  <!-- Subtitle Line 1 -->
  <text x="600" y="200" fill="#e2e8f0" font-size="19" text-anchor="middle" class="sub-text" font-weight="500">
    Root Cause Analysis, Known Error Databases (KEDB) &amp; Incident Recurrence Prevention
  </text>

  <!-- Subtitle Line 2 -->
  <text x="600" y="230" fill="#94a3b8" font-size="14" text-anchor="middle" class="sub-text">
    Comparing Leading Enterprise SaaS Platforms &amp; Sovereign Open-Source Self-Hosted Solutions
  </text>

  <!-- Pipeline Step Indicator in Foreground -->
  <g transform="translate(325, 275)">
    <!-- Node 1 -->
    <rect x="0" y="0" width="125" height="36" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
    <text x="62" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="sub-text">🚨 Incidents</text>
    
    <!-- Arrow 1 -->
    <path d="M 132 18 L 150 18" stroke="#64748b" stroke-width="2" marker-end="none" />
    
    <!-- Node 2 -->
    <rect x="156" y="0" width="125" height="36" rx="8" fill="#1e293b" stroke="#818cf8" stroke-width="1" />
    <text x="218" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="sub-text">🔬 RCA &amp; Problem</text>

    <!-- Arrow 2 -->
    <path d="M 288 18 L 306 18" stroke="#64748b" stroke-width="2" />

    <!-- Node 3 -->
    <rect x="312" y="0" width="115" height="36" rx="8" fill="#1e293b" stroke="#c084fc" stroke-width="1" />
    <text x="369" y="22" fill="#e2e8f0" font-size="12" font-weight="600" text-anchor="middle" class="sub-text">📖 KEDB Entry</text>

    <!-- Arrow 3 -->
    <path d="M 434 18 L 452 18" stroke="#64748b" stroke-width="2" />

    <!-- Node 4 -->
    <rect x="458" y="0" width="122" height="36" rx="8" fill="#1e293b" stroke="#34d399" stroke-width="1" />
    <text x="519" y="22" fill="#34d399" font-size="12" font-weight="600" text-anchor="middle" class="sub-text">✅ Permanent Fix</text>
  </g>

  <!-- Bottom Accent Line -->
  <rect x="300" y="345" width="600" height="2" rx="1" fill="url(#streamGrad)" opacity="0.8" />
</svg>
